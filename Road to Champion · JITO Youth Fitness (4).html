<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Road to Champion · JITO Youth Fitness</title>
<meta name="theme-color" content="#10231B">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1EC; --surface:#F8F9F5; --surface2:#E1E8E0; --ink:#14201A; --muted:#5B6B62; --line:#D6DDD3;
  --navy:#F8F9F5; --navy2:#E1E8E0; --on-navy:#14201A; --on-navy-muted:#5B6B62;
  --lime:#0B7F5A; --on-lime:#FFFFFF; --primary-ink:#0B7F5A; --primary-soft:#D6EFE4; --accent:#FF6B2C; --accent-soft:rgba(255,107,44,.12); --blush:rgba(11,127,90,.08);
  --gold:#D99A1E; --gold-soft:rgba(217,154,30,.16); --gold-ink:#8A5A00; --streak:#F2600C;
  --you:#0B7F5A; --ok:#0B7F5A; --ok-soft:#D6EFE4; --bad:#D6402B; --bad-soft:rgba(214,64,43,.10);
  --disp:"Big Shoulders Display",Impact,"Arial Narrow",sans-serif; --body:Figtree,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;font-family:var(--disp);font-weight:800;line-height:.95;letter-spacing:.01em}
p{margin:0}
.num{font-family:var(--disp);font-weight:800;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.hide{display:none!important}

/* shell */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 16px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--disp);font-weight:800;font-size:19px;letter-spacing:.04em;flex:1;min-width:0}
.brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:inline-flex;background:var(--surface2);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--lime);color:var(--on-lime)}
.col{max-width:560px;margin:0 auto;padding:18px 16px 110px}
.wide{max-width:1120px;margin:0 auto;padding:18px 16px 60px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .in{display:flex;width:100%;max-width:560px}
.tabbar button{flex:1;border:0;background:none;padding:10px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted)}
.tabbar button svg{width:22px;height:22px}
.tabbar button[aria-current="page"]{color:var(--ink)}
.tabbar button[aria-current="page"] svg{color:var(--primary-ink)}
.bar{background:#10231B;border-bottom:0}
.brand{color:#fff}
.bar .seg{background:rgba(255,255,255,.1)}
.bar .seg button{color:#B6C5BB}
.bar .seg button[aria-pressed="true"]{background:#0B9B6B;color:#fff}
.bar .viewas{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.22);color:#fff}
.bar .viewas option{color:#14201A}
.atabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;margin-bottom:14px;border-bottom:1px solid var(--line)}
.atabs button{border:0;background:transparent;padding:8px 14px;border-radius:8px;font-weight:600;color:var(--muted);white-space:nowrap}
.atabs button[aria-current="page"]{background:var(--lime);color:var(--on-lime)}
.viewas{max-width:140px;font-size:16px;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface)}

/* pieces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 2px 8px rgba(20,32,26,.06)}
.card h3{font-size:24px;margin-bottom:10px}
.card.plain{border:0;background:transparent;padding:0}
.btn{border:0;border-radius:10px;padding:11px 18px;font-weight:700;background:var(--lime);color:var(--on-lime);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.gold{background:var(--ink);color:#fff}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.sm{padding:7px 12px;font-size:14px;border-radius:8px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;background:var(--surface2);color:var(--muted)}
.chip.gold{background:var(--gold-soft);color:var(--gold-ink)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.navy{background:var(--lime);color:var(--on-lime)}
.empty{border:1.5px dashed var(--line);border-radius:14px;padding:22px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);margin-bottom:4px}
label.f{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:10px}
label.f input,label.f select,label.f textarea{display:block;width:100%;margin-top:4px;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--bg);font-weight:500;color:var(--ink)}
label.f textarea{min-height:76px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 12px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:640px){.grid3{grid-template-columns:1fr 1fr}.grid4{grid-template-columns:1fr 1fr}}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:600;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tw{overflow-x:auto}

/* hero */
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:6px 0 16px}
.hero h1{font-size:clamp(46px,13vw,76px);text-transform:uppercase}
.hero h1 small{display:block;font-size:.42em;color:var(--primary-ink);letter-spacing:.12em;margin-top:6px}
.days{text-align:right;line-height:1}
.days b{display:block;font-family:var(--disp);font-weight:900;font-size:56px}
.days span{font-size:13px;color:var(--muted);font-weight:600}

/* champion zone */
.zone{background:var(--navy);color:var(--on-navy);border-radius:16px;padding:6px 0;position:relative;border:2px solid var(--lime)}
.lb{display:flex;align-items:center;gap:12px;padding:11px 16px}
.zone .lb+.lb{border-top:1px solid var(--line)}
.lb .rk{font-family:var(--disp);font-weight:900;font-size:34px;min-width:58px;text-align:left;color:var(--primary-ink)}
.lb .nm{flex:1;min-width:0;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb .pt{font-family:var(--disp);font-weight:800;font-size:26px;font-variant-numeric:tabular-nums}
.lb .pt i{font-style:normal;font-size:.55em;opacity:.7;margin-left:3px;font-family:var(--body);font-weight:600}
.lb.first{padding:16px}
.lb.first .rk{font-size:52px;color:var(--gold-ink)}
.lb.first .nm{font-size:20px}
.lb.first .pt{font-size:36px}
.lb.me{background:rgba(11,127,90,.10)}
.youtag{background:var(--lime);color:var(--on-lime);font-size:11px;font-weight:800;padding:2px 7px;border-radius:5px;margin-left:8px;vertical-align:2px}
.zline{display:flex;align-items:center;gap:12px;margin:14px 0 4px;color:var(--primary-ink);font-family:var(--disp);font-weight:800;letter-spacing:.2em;font-size:15px}
.zline::before,.zline::after{content:"";flex:1;border-top:2px dashed var(--lime)}
.rest{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.rest .lb+.lb{border-top:1px solid var(--line)}
.rest .lb .rk{color:var(--muted);font-size:26px}
.rest .lb.me{background:rgba(11,127,90,.08)}
.gap{margin:14px 0;background:var(--lime);color:var(--on-lime);border-radius:12px;padding:12px 16px;font-family:var(--disp);font-weight:900;font-size:28px;letter-spacing:.03em;text-align:center}
.gap.in{background:var(--ok-soft);color:var(--ok)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:14px}
.stats div{background:var(--surface);padding:12px 14px}
.stats b{display:block;font-family:var(--disp);font-size:34px;font-weight:800;line-height:1}
.stats span{font-size:13px;color:var(--muted)}
.res{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.res:last-child{border-bottom:0}
.res b{font-family:var(--disp);font-size:22px}
.prize{border-radius:14px;border:1px solid var(--gold);background:linear-gradient(135deg,var(--surface),var(--surface2));color:var(--on-navy);padding:18px;margin-bottom:14px}
.prize h3{font-size:30px;color:var(--gold-ink)}
.pz{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.pz img{width:72px;height:72px;border-radius:10px;object-fit:cover;background:var(--surface2)}
.pz .r{font-family:var(--disp);font-weight:900;font-size:30px;color:var(--gold-ink);width:40px}

/* events */
.ev{display:flex;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;align-items:center}
.ev .d{width:54px;text-align:center;flex:none;line-height:1}
.ev .d b{display:block;font-family:var(--disp);font-size:34px;font-weight:900}
.ev .d span{font-size:12px;font-weight:700;color:var(--muted)}
.ev .m{flex:1;min-width:0}
.ev .m strong{display:block}
.ev .m small{color:var(--muted)}
.ev.done{opacity:.72}
.ev.lock{background:var(--surface2)}

/* modal */
#modal{position:fixed;top:0;right:0;bottom:0;left:0;z-index:50;display:none;align-items:flex-end;justify-content:center;background:rgba(16,35,27,.55)}
#modal.on{display:flex}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet.wide{max-width:760px}
@media(min-width:700px){#modal{align-items:center}.sheet{border-radius:18px}}
.sheet h2{font-size:34px;margin-bottom:12px}
.sheet .x{float:right}
.cam{position:relative;background:#000;border-radius:14px;overflow:hidden;aspect-ratio:1/1;margin-bottom:12px}
@supports not (aspect-ratio:1/1){.cam{height:86vw;max-height:520px}}
.cam video{width:100%;height:100%;object-fit:cover}
.cam .frame{position:absolute;top:18%;right:18%;bottom:18%;left:18%;border:3px solid var(--lime);border-radius:18px;box-shadow:0 0 0 999px rgba(0,0,0,.45)}
.cam .msg{position:absolute;left:0;right:0;bottom:0;padding:10px;color:#fff;text-align:center;font-size:14px;background:rgba(0,0,0,.55)}
.res-ok{background:var(--ok-soft);color:var(--ok);border-radius:14px;padding:18px;text-align:center}
.res-ok .big{font-family:var(--disp);font-weight:900;font-size:64px;line-height:1}
.res-bad{background:var(--bad-soft);color:var(--bad);border-radius:12px;padding:12px 14px;margin-bottom:12px;font-weight:600}
.cv{max-width:100%;height:auto;border-radius:12px;display:block;margin:0 auto 12px;border:1px solid var(--line)}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--lime);color:var(--on-lime);padding:10px 16px;border-radius:10px;z-index:80;font-weight:600;max-width:90%;display:none;text-align:center;box-shadow:0 6px 24px rgba(16,35,27,.3)}
#toast.on{display:block}
.pill-list{display:flex;flex-wrap:wrap;gap:6px}
.hof{border:1px solid var(--gold);background:linear-gradient(135deg,var(--surface),var(--surface2));color:var(--on-navy);border-radius:16px;padding:18px;margin-bottom:12px}
.hof .yr{font-family:var(--disp);font-weight:900;font-size:60px;color:var(--gold-ink);line-height:.9}
.hof .champ{font-family:var(--disp);font-weight:800;font-size:34px;margin:6px 0 2px}
.hof .others{margin-top:12px;border-top:1px solid var(--line);padding-top:8px}
.hof .others div{display:flex;justify-content:space-between;padding:5px 0}
.tl{border-left:3px solid var(--lime);margin-left:6px;padding-left:16px}
.tl div{padding:8px 0}
.tl b{font-family:var(--disp);font-size:24px;margin-right:8px}
.explorer{display:grid;grid-template-columns:180px 220px 1fr;gap:12px;align-items:start}
@media(max-width:860px){.explorer{grid-template-columns:1fr}}
.explorer .list{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;max-height:420px;overflow-y:auto}
.explorer .list button{display:flex;justify-content:space-between;width:100%;border:0;background:transparent;padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);font-size:14px}
.explorer .list button[aria-current="true"]{background:var(--lime);color:var(--on-lime)}
textarea.json{width:100%;min-height:340px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.path{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;background:var(--surface2);padding:3px 8px;border-radius:6px}
.note{background:var(--blush);color:#0B6B4C;border:1px solid rgba(11,127,90,.22);border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
@media(prefers-reduced-motion:no-preference){.pop{animation:pop .45s cubic-bezier(.2,1.4,.4,1)}@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:none;opacity:1}}}

/* upcoming-events slideshow */
.showcase{margin:0 0 18px}
.showcase .sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.showcase .sh h3{font-size:24px}
.slides{display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;scrollbar-width:none;border-radius:18px}
.slides::-webkit-scrollbar{display:none}
.slide{position:relative;flex:0 0 100%;width:100%;scroll-snap-align:center;scroll-snap-stop:always;min-height:220px;padding:0;border:1px solid var(--line);border-radius:18px;overflow:hidden;text-align:left;color:#fff;background:#10231B;display:flex}
.slide.noimg{background:repeating-linear-gradient(120deg,rgba(255,255,255,.05) 0 14px,transparent 14px 30px),linear-gradient(135deg,#0B9B6B,#064E3B)}
.slide .bg{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover}
.slide .shade{position:absolute;top:0;right:0;bottom:0;left:0;background:linear-gradient(180deg,rgba(16,35,27,.2) 0%,rgba(16,35,27,.92) 100%)}
.slide.noimg .shade{background:radial-gradient(circle at 85% 0%,rgba(255,255,255,.16),transparent 55%)}
.slide .in{position:relative;z-index:1;display:flex;flex-direction:column;justify-content:space-between;gap:18px;width:100%;padding:14px 16px}
.slide .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.slide .when{font-family:var(--disp);font-weight:700;letter-spacing:.12em;font-size:15px;color:#fff;background:var(--accent);padding:3px 10px;border-radius:999px}
.slide .bot{display:flex;gap:14px;align-items:flex-end}
.slide .dt{flex:none;text-align:center;line-height:1;background:rgba(16,35,27,.62);border:1px solid rgba(255,255,255,.3);border-radius:12px;padding:8px 12px}
.slide .dt b{display:block;font-family:var(--disp);font-size:38px;font-weight:900}
.slide .dt span{font-size:12px;font-weight:700;color:#6EE7B7;letter-spacing:.08em}
.slide h3{font-size:clamp(28px,8vw,40px);text-transform:uppercase;text-shadow:0 2px 12px rgba(16,35,27,.3)}
.slide p{font-size:14px;color:#D5DADF;margin:4px 0 8px}
.slide .chip{background:rgba(16,35,27,.62);color:#fff;border:1px solid rgba(255,255,255,.2)}
.slide .chip.gold{background:rgba(217,154,30,.25);color:#FFD27A;border-color:rgba(217,154,30,.5)}
.slide .chip.ok{background:rgba(63,191,147,.2);color:#8BE6C2}
.slide .chip.navy{background:#0B9B6B;color:#fff;border-color:transparent}
.slide .chip.bad{background:rgba(226,109,90,.2);color:#F2A090}
.slide.noimg .chip.navy{background:#fff;color:#0A5C42}
.dots{display:flex;justify-content:center;gap:4px;margin-top:6px}
.dots button{border:0;background:transparent;padding:8px 3px}
.dots button i{display:block;width:8px;height:8px;border-radius:99px;background:rgba(20,32,26,.2);transition:width .2s,background .2s}
.dots button.on i{width:22px;background:var(--lime)}
.chk{display:flex;gap:10px;align-items:center;font-size:14px;color:var(--muted);margin:2px 0 14px}
.chk input{width:20px;height:20px;accent-color:var(--primary-ink);margin:0}
@media print{.bar,.tabbar{display:none}}
</style>
</head>
<body>
<noscript><div style="padding:24px;font-family:sans-serif;color:#fff">This app needs JavaScript. Please enable it in Safari settings.</div></noscript>
<div id="app"><div class="col"><div class="empty"><b>Loading Road to Champion…</b>Connecting to the championship data.</div></div></div>
<div id="modal" role="dialog" aria-modal="true"></div>
<div id="toast" role="status"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<script>
'use strict';
window.addEventListener('error',function(e){var a=document.getElementById('app');if(a&&!(window.ST&&ST.ready)){a.innerHTML='<div class="col"><div class="empty"><b>Couldn\'t start the app</b>'+String(e&&e.message||'Unknown error').replace(/</g,'&lt;')+'<br><br><button class="btn" onclick="location.reload()">Reload</button></div></div>'}});
/* ============ utils ============ */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const fmt=n=>Number(n||0).toLocaleString('en-IN');
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const rid=()=>Math.random().toString(36).slice(2,10);
const DAY=864e5;
const dayEnd=s=>new Date(s+'T23:59:59'), dayStart=s=>new Date(s+'T00:00:00');
const fmtEv=d=>new Date(d).toLocaleString('en-IN',{weekday:'short',day:'numeric',month:'short',hour:'numeric',minute:'2-digit'});
const fmtDay=d=>new Date(d).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});

function memberView(A){
  const u=target();let inner;

function showSignIn(msg){

function askName(){openModal(`<h2>Welcome, athlete</h2><p class="muted" style="margin-bottom:12px">Pick the name that shows on the leaderboard.</p><label class="f">Display name<input id="nm" maxlength="40" value="${esc(ST.ME.name==='You'?'':ST.ME.name)}" placeholder="e.g. Rohan Shah"></label><button class="btn gold" data-act="savename" data-submit>Join the leaderboard</button>`,()=>{})}
/* ============ modal ============ */
let modalClose=null;
function openModal(html,onClose,cls=''){modalClose=onClose||null;const m=$('#modal');m.innerHTML=`<div class="sheet ${cls}">${html}</div>`;m.classList.add('on')}
function closeModal(silent){stopCam();const m=$('#modal');m.classList.remove('on');m.innerHTML='';const f=modalClose;modalClose=null;if(f&&!silent)f()}

document.addEventListener('keydown',e=>{if(e.key==='Enter'){const t=e.target,sh=t.closest&&t.closest('.sheet');const b=sh&&sh.querySelector('[data-submit]');if(b&&t.tagName==='INPUT'&&t.type!=='file'&&t.type!=='checkbox'){e.preventDefault();b.click()}}});

/* ============ member: home ============ */
function seasonRes(A,n,u){
  const c=A.c,s=A.seasons[n],st=seasonState(c,n,A),row=s.rows.find(r=>r.uid===u);
  if(st==='Upcoming')return`<div class="res"><span>Season ${n}</span><span class="muted">Starts ${fmtDay(c.seasons[n].start)}</span></div>`;
  if(!row){const m=A.mets[u];return`<div class="res"><span>Season ${n} <span class="chip">${st}</span></span><span class="muted">${m&&m.ev[n]?`${m.ev[n]}/${c.minEventsSeason} events to qualify`:'Not ranked yet'}</span></div>`}
  const g=s.gold.includes(u);return`<div class="res"><span>Season ${n} <span class="chip ${s.final?'ok':''}">${s.final?'Final':st==='Live'?'Live':'Ended'}</span></span><span><b>#${row.rank}</b> <span class="muted">of ${s.rows.length}</span> ${g?`<span class="chip gold">🥇 Gold${s.final?'':' · projected'}</span>`:''}</span></div>`}
function prizeBlock(){
  const p=S.prizes.main;if(!p||!p.status||p.status==='hidden')return'';
  if(p.status==='soon')return`<div class="prize"><h3>TOP 5 GRAND PRIZE — COMING SOON</h3><p style="margin-top:6px;color:var(--on-navy-muted)">${esc(p.teaser||'')}</p></div>`;
  if(p.status==='teaser')return`<div class="prize"><h3>${esc(p.teaser||'Something BIG awaits the Top 5 👀')}</h3></div>`;
  const items=[1,2,3,4,5].map(r=>({r,...(p.items&&p.items[r]||{})})).filter(i=>i.title);
  return`<div class="prize"><h3>${esc(p.headline||'Year-End Grand Prize')}</h3>${p.eligibility?`<p style="color:var(--on-navy-muted);margin:4px 0 8px;font-size:14px">${esc(p.eligibility)}</p>`:''}${items.map(i=>`<div class="pz"><div class="r">#${i.r}</div>${i.image?`<img src="${i.image}" alt="">`:''}<div><b>${esc(i.title)}</b>${i.value?` <span class="chip gold">${esc(i.value)}</span>`:''}<div style="font-size:14px;color:var(--on-navy-muted)">${esc(i.desc||'')}</div>${i.sponsor?`<div style="font-size:13px">Sponsor: ${esc(i.sponsor)}</div>`:''}${i.r===1&&i.extra?`<div style="font-size:13px;color:var(--gold-ink)">＋ ${esc(i.extra)}</div>`:''}</div></div>`).join('')}</div>`}
let slideHold=0,slideTimer=null;
function scrollSlide(i){const s=$('#slides');if(!s)return;const l=i*s.clientWidth;try{s.scrollTo({left:l,behavior:'smooth'})}catch(e){s.scrollLeft=l}}
function whenLabel(d){const a=new Date(d),t=new Date(),k=Math.round((new Date(a.getFullYear(),a.getMonth(),a.getDate())-new Date(t.getFullYear(),t.getMonth(),t.getDate()))/DAY);return k<=0?'TODAY':k===1?'TOMORROW':'IN '+k+' DAYS'}
function slideShow(A){
  const c=A.c,u=target(),now=Date.now()-6*36e5,up=A.evs.filter(e=>+new Date(e.date)>=now).slice(0,8);
  const head=`<div class="sh"><h3>Upcoming events</h3><button class="btn ghost sm" data-act="tab" data-v="events">See all</button></div>`;
  if(!up.length)return`<section class="showcase">${head}<div class="empty"><b>No upcoming events</b>New events will slide in here as soon as they are scheduled.</div></section>`;
  const sl=up.map(e=>{const s=evStatus(A,e,u),d=new Date(e.date),ok=typeof e.image==='string'&&/^data:image\/[a-z+.-]+;base64,[A-Za-z0-9+\/=]+$/.test(e.image);
    return`<button class="slide ${ok?'':'noimg'}" data-act="scan" data-id="${esc(e.id)}" aria-label="${esc(e.title)}">${ok?`<img class="bg" src="${e.image}" alt="">`:''}<div class="shade"></div><div class="in"><div class="top"><span class="chip ${e.type==='gold'?'gold':''}">${TYPE[e.type]}</span><span class="when">${whenLabel(e.date)}</span></div><div class="bot"><div class="dt"><b>${d.getDate()}</b><span>${d.toLocaleString('en-IN',{month:'short'}).toUpperCase()}</span></div><div style="min-width:0"><h3>${esc(e.title)}</h3><p>${d.toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit'})} · ${esc(e.venue||'Venue TBA')}</p><div class="row"><span class="chip">+${evBase(e,c)} CP</span>${s.t}</div></div></div></div></button>`}).join('');
  const dots=up.length>1?`<div class="dots">${up.map((e,i)=>`<button data-act="slide" data-v="${i}" aria-label="Event ${i+1}" class="${i===(UI.slide||0)?'on':''}"><i></i></button>`).join('')}</div>`:'';
  return`<section class="showcase" aria-label="Upcoming events">${head}<div class="slides" id="slides">${sl}</div>${dots}</section>`}
function initSlides(){
  const el=$('#slides');if(!el)return;
  if(UI.slide&&UI.slide<el.children.length)el.scrollLeft=UI.slide*el.clientWidth;
  const dots=$$('.dots button');
  el.addEventListener('scroll',()=>{const i=Math.round(el.scrollLeft/Math.max(1,el.clientWidth));UI.slide=i;dots.forEach((d,k)=>d.classList.toggle('on',k===i))},{passive:true});
  ['touchstart','pointerdown','wheel'].forEach(ev=>el.addEventListener(ev,()=>{slideHold=Date.now()+8000},{passive:true}));
  if(!slideTimer)slideTimer=setInterval(()=>{const s=$('#slides');if(!s||document.hidden||Date.now()<slideHold||s.children.length<2||$('#modal').classList.contains('on'))return;const i=(Math.round(s.scrollLeft/Math.max(1,s.clientWidth))+1)%s.children.length;scrollSlide(i)},5000)}
function vHome(A){
  const c=A.c,u=target(),rows=A.annual,N=c.topN,me=rows.find(r=>r.uid===u),mm=A.mets[u],isme=r=>r.uid===u;
  const row=(r,f)=>`<div class="lb ${f?'first':''} ${isme(r)?'me':''}"><div class="rk">#${r.rank}</div><div class="nm">${esc(r.name||nameOf(r.uid))}${isme(r)?'<span class="youtag">YOU</span>':''}${f?' 👑':''}</div><div class="pt">${fmt(r.cp)}<i>CP</i></div></div>`;
  let h=`<div class="hero"><h1>Road to Champion<small>${c.year}</small></h1><div class="days"><b class="num">${A.closed?'🏁':daysLeft(c)}</b><span>${A.closed?'final':'days left'}</span></div></div>`;
  h+=slideShow(A);
  if(!rows.length){
    h+=`<div class="empty"><b>The leaderboard is waiting for its first athletes.</b>${A.evs.length?`Scan an event QR from the Events tab. You need ${c.minEventsAnnual} events to be ranked.`:'No events have been scheduled yet.'}</div>`;
    if(mm&&mm.events)h+=`<div class="gap">${fmt(mm.cp)} CP · ${mm.events}/${c.minEventsAnnual} EVENTS</div>`;
    return h+prizeBlock()}
  h+=`<div class="zone">${rows.slice(0,N).map((r,i)=>row(r,i===0)).join('')}</div><div class="zline">CHAMPION ZONE</div>`;
  let rest=[];
  if(me&&me.rank>N){rest=rows.filter(r=>r.rank>=Math.max(N+1,me.rank-1)&&r.rank<=me.rank+1)}else rest=rows.slice(N,N+2);
  if(me&&me.rank>N&&rest[0]&&rest[0].rank>N+1)rest.unshift(null);
  if(!me&&mm)rest.push({uid:u,rank:'–',cp:mm.cp,name:nameOf(u)});
  if(rest.length)h+=`<div class="rest">${rest.map(r=>r?row(r,false):'<div class="lb" style="justify-content:center;color:var(--muted)">⋯</div>').join('')}</div>`;
  let gapTxt='',gapVal='—',inZone=me&&me.rank<=N;
  if(A.closed)gapTxt=`<div class="gap in">THE ${c.year} CHAMPIONSHIP IS CLOSED</div>`;
  else if(inZone){const nx=rows[N];const lead=nx?me.cp-nx.cp:me.cp;gapVal='In';gapTxt=`<div class="gap in">YOU'RE IN THE CHAMPION ZONE · ${fmt(lead)} CP CLEAR OF #${N+1}</div>`}
  else if(me){const need=rows[N-1]?rows[N-1].cp-me.cp:0;gapVal=fmt(need);gapTxt=rows[N-1]?`<div class="gap">${need>0?`${fmt(need)} CP AWAY FROM TOP ${N}`:`TIED WITH #${N} · ONE MORE EVENT DECIDES IT`}</div>`:`<div class="gap in">OPEN SPOT IN THE TOP ${N}</div>`}
  else if(mm){const left=Math.max(0,c.minEventsAnnual-mm.events);gapTxt=`<div class="gap">${left?`ATTEND ${left} MORE EVENT${left>1?'S':''} TO ENTER THE RANKING`:'JUST OUTSIDE THE RANKING'}</div>`}
  else gapTxt=`<div class="gap">SCAN AN EVENT QR TO JOIN THE RACE</div>`;
  h+=gapTxt;
  h+=`<div class="stats"><div><b>${me?'#'+me.rank:'—'}</b><span>Current annual rank</span></div><div><b>${fmt(mm?mm.cp:0)}</b><span>Championship Points</span></div><div><b>${gapVal}</b><span>CP required for Top ${N}</span></div><div><b>${A.closed?'Final':daysLeft(c)}</b><span>Days remaining</span></div></div>`;
  h+=`<div class="card"><h3>Season results</h3>${seasonRes(A,1,u)}${seasonRes(A,2,u)}</div>`;
  if(mm){const k=mm.cats;const L=[['Regular events',k.events],['Challenges completed',k.challenges],[`🔥 Attendance streaks · best run ${mm.longest}`,k.streak],['Gold qualification',k.goldQual],['Season ranking bonus',k.seasonRank],['Gold Event performance',k.perf],['Bonus',k.bonus]].filter(x=>x[1]);
    h+=`<div class="card"><h3>How you earned ${fmt(mm.cp)} CP</h3>${L.length?L.map(x=>`<div class="res"><span>${x[0]}</span><b ${x[0].startsWith('Attendance')?'style="color:var(--streak)"':''}>+${fmt(x[1])}</b></div>`).join(''):'<p class="muted">Nothing yet. Your first check-in is worth '+c.scoring.regular+' CP.</p>'}</div>`}
  h+=prizeBlock();
  h+=`<details class="card"><summary style="font-weight:700;cursor:pointer">How Championship Points work</summary><div style="margin-top:10px;font-size:14px" class="muted">Regular event +${c.scoring.regular} · Challenge +${c.scoring.challenge} · Attendance streak +${c.scoring.streak} every ${c.scoring.streakEvery} events in a row · Gold qualification +${c.scoring.goldQual} · Season Top 10 +${c.scoring.top10} · Top 5 +${c.scoring.top5} · Season Champion +${c.scoring.champion} · Gold Event performance +${c.scoring.perfMin} to +${c.scoring.perfMax}. This leaderboard does not reset after Season 1. It closes when the championship year ends. Ties go to whoever attended more events. You need ${c.minEventsAnnual} events to be ranked.</div></details>`;

/* ============ member: events ============ */
function evStatus(A,e,u){
  const m=A.mets[u],done=m&&m.att[e.id];if(done)return{k:'done',t:'<span class="chip ok">Checked in ✓</span>'};
  if(e.open===false)return{k:'closed',t:'<span class="chip">Closed</span>'};
  if(e.type==='gold'){const s=A.sd[e.season||1];if(!s||!s.gold.includes(u))return{k:'lock',t:'<span class="chip gold">🔒 Gold only</span>'}}
  return{k:'open',t:'<span class="chip navy">Tap to scan</span>'}}
function vEvents(A){
  const c=A.c,u=target(),now=Date.now()-6*36e5;const up=A.evs.filter(e=>+new Date(e.date)>=now),past=A.evs.filter(e=>+new Date(e.date)<now).reverse();
  const card=e=>{const s=evStatus(A,e,u),d=new Date(e.date);return`<button class="ev ${s.k==='done'?'done':''} ${s.k==='lock'?'lock':''}" data-act="scan" data-id="${esc(e.id)}"><div class="d"><b>${d.getDate()}</b><span>${d.toLocaleString('en-IN',{month:'short'})}</span></div><div class="m"><strong>${esc(e.title)}</strong><small>${d.toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit'})} · ${esc(e.venue||'Venue TBA')}</small><div style="margin-top:5px" class="row"><span class="chip ${e.type==='gold'?'gold':''}">${TYPE[e.type]}</span><span class="chip">+${evBase(e,c)} CP</span>${s.t}</div></div></button>`};
  let h=`<div class="hero"><h1>Events</h1></div><p class="muted" style="margin:-6px 0 14px">Tap an event, then scan the QR code shown at the venue.</p>`;
  if(!A.evs.length)return h+`<div class="empty"><b>No events yet</b>When admins schedule events, they appear here.</div>`;
  h+=up.length?up.map(card).join(''):'<div class="empty">No upcoming events.</div>';
  if(past.length)h+=`<h3 style="font-size:26px;margin:20px 0 10px">Past events</h3>`+past.map(card).join('');
  return h}

/* ============ member: seasons ============ */
function vSeasons(A){
  const c=A.c,u=target(),n=UI.season||(seasonState(c,2,A)==='Upcoming'?1:Date.now()>+dayStart(c.seasons[2].start)?2:1),s=A.seasons[n];
  let h=`<div class="hero"><h1>Seasons<small>${c.year}</small></h1></div><div class="seg" style="margin-bottom:14px">${[1,2].map(i=>`<button data-act="season" data-v="${i}" aria-pressed="${n===i}">Season ${i}</button>`).join('')}</div>`;
  h+=`<p class="muted" style="margin-bottom:12px">${fmtDay(c.seasons[n].start)} – ${fmtDay(c.seasons[n].end)} · <b>${seasonState(c,n,A)}</b>. Top ${c.goldCount} eligible members become Gold and unlock the Gold Event.</p>`;
  if(!s.rows.length)h+=`<div class="empty"><b>No ranked members yet</b>Attend ${c.minEventsSeason} events in this season to be ranked.</div>`;
  else{
    const g=s.rows.slice(0,c.goldCount),rest=s.rows.slice(c.goldCount,c.goldCount+8);
    const r=x=>`<div class="lb ${x.uid===u?'me':''}"><div class="rk">#${x.rank}</div><div class="nm">${esc(nameOf(x.uid))}${x.uid===u?'<span class="youtag">YOU</span>':''}</div><div class="pt">${fmt(x.sp)}<i>SP</i></div></div>`;
    h+=`<div class="zone">${g.map(r).join('')}</div>`;
    if(rest.length)h+=`<div class="zline">${s.final?'GOLD LINE':'PROJECTED GOLD LINE'}</div><div class="rest">${rest.map(r).join('')}</div>`}
  const ge=A.evs.filter(e=>e.type==='gold'&&(e.season||1)===n);
  h+=`<h3 style="font-size:26px;margin:20px 0 10px">Gold Event</h3>`+(ge.length?ge.map(e=>{const st=evStatus(A,e,u);return`<button class="ev ${st.k==='lock'?'lock':''}" data-act="scan" data-id="${esc(e.id)}"><div class="d"><b>🥇</b></div><div class="m"><strong>${esc(e.title)}</strong><small>${fmtEv(e.date)} · ${esc(e.venue||'')}</small><div style="margin-top:5px">${st.t}</div></div></button>`}).join(''):'<div class="empty">The Gold Event for this season hasn\'t been announced.</div>');
  return h}

/* ============ member: hall of fame ============ */

/* ============ member: me ============ */

  h+=`<div class="row"><button class="btn ghost" data-act="card" data-year="${c.year}" data-u="${esc(u)}" ${m?'':'disabled'}>Preview my ${c.year} card</button>${UI.viewAs?'':'<button class="btn ghost" data-act="editname">Change display name</button>'}</div>`;

  if(ST.mode==='local')h+=`<p class="note" style="margin-top:14px">Offline mode: events, scores and profiles are stored only on this device. Open the shared link while signed in to Claude to use one leaderboard for everyone.</p>`;

/* ============ champion card ============ */
function rr(x,a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()}

  let h=`<div class="card"><h3>Add points</h3><div class="grid3"><label class="f">Member<select id="aw_u">${A.uids.map(u=>`<option value="${esc(u)}">${esc(nameOf(u))}</option>`).join('')}</select></label><label class="f">Reason<select id="aw_t"><option value="gold_perf">Gold Event performance (${c.scoring.perfMin}–${c.scoring.perfMax})</option><option value="challenge">Challenge completed</option><option value="bonus">Bonus</option></select></label><label class="f">Championship Points<input id="aw_cp" type="number" value="${c.scoring.perfMin}"></label></div><div class="grid2"><label class="f">Event (optional)<select id="aw_e"><option value="">None</option>${A.evs.map(e=>`<option value="${esc(e.id)}">${esc(e.title)}</option>`).join('')}</select></label><label class="f">Note<input id="aw_n" placeholder="Fastest 5K, best form…"></label></div><button class="btn gold" data-act="awadd" ${A.uids.length?'':'disabled'}>Award points</button></div>`;
  h+=`<div class="card"><h3>Members</h3>${list.length?`<div class="tw"><table><thead><tr><th>Name</th><th>Events</th><th>CP</th><th>S1 SP</th><th>S2 SP</th><th>Gold</th><th></th></tr></thead><tbody>${list.map(m=>`<tr><td><b>${esc(nameOf(m.uid))}</b><br><span class="path">members/${esc(m.uid)}</span></td><td>${m.events}</td><td class="num" style="font-size:20px">${fmt(m.cp)}</td><td>${m.sp[1]}</td><td>${m.sp[2]}</td><td>${m.golds?'🥇×'+m.golds:'–'}</td><td><div class="row"><button class="btn ghost sm" data-act="viewasm" data-u="${esc(m.uid)}">View as</button>${m.uid.startsWith('demo_')?'':''}</div></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty"><b>No members yet</b>Members appear when they set a name or check in.</div>'}</div>`;
  h+=`<div class="card"><h3>Awards &amp; adjustments</h3>${aw.length?`<div class="tw"><table><tbody>${aw.map(a=>`<tr><td>${esc(nameOf(a.uid))}</td><td>${esc(a.note||a.type)}</td><td><span class="chip">${esc(a.type)}</span></td><td class="num" style="font-size:20px">+${fmt(a.cp)}</td><td>${a.src&&/^s\d$/.test(a.src)?'<span class="muted">season</span>':`<button class="btn danger sm" data-act="awdel" data-id="${esc(a.id)}">Remove</button>`}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No awards yet.</div>'}</div>`;
  return h}
async function addAward(){
  const c=CFG(),u=$('#aw_u').value,t=$('#aw_t').value;let cp=+$('#aw_cp').value;if(!cp){toast('Enter the points to award.');return}
  if(t==='gold_perf')cp=clamp(cp,c.scoring.perfMin,c.scoring.perfMax);
  const items=awardsOf(c.year).slice();items.push({id:'aw_'+rid(),uid:u,type:t,cp,eventId:$('#aw_e').value||null,note:$('#aw_n').value.trim(),src:'manual',ts:Date.now()});
  await put('awards','y'+c.year,{items});toast(`+${cp} CP awarded`);_cache=null;render()}

/* scoring */
const SCF=[['regular','Regular event attendance'],['challenge','Challenge completed'],['goldAttend','Gold Event attendance'],['streak','Major attendance streak'],['streakEvery','Streak length (events in a row)'],['goldQual','Gold qualification'],['top10','Season Top 10'],['top5','Season Top 5'],['champion','Season Champion'],['perfMin','Gold Event performance, minimum'],['perfMax','Gold Event performance, maximum']];
function aScoring(A){const c=A.c;
  let h=`<div class="card"><h3>Championship Points</h3><p class="muted" style="margin-bottom:12px">These rules apply to the whole year. Changing them re-scores everyone instantly.</p><div class="grid3">${SCF.map(([k,l])=>`<label class="f">${l}<input id="sc_${k}" type="number" value="${c.scoring[k]}"></label>`).join('')}</div></div>`;
  h+=`<div class="card"><h3>Seasonal points &amp; eligibility</h3><div class="grid3"><label class="f">Season points: regular<input id="sp_regular" type="number" value="${c.sp.regular}"></label><label class="f">Season points: challenge<input id="sp_challenge" type="number" value="${c.sp.challenge}"></label><label class="f">Season points: gold<input id="sp_gold" type="number" value="${c.sp.gold}"></label><label class="f">Gold members per season<input id="c_goldCount" type="number" value="${c.goldCount}"></label><label class="f">Min events to rank in a season<input id="c_minEventsSeason" type="number" value="${c.minEventsSeason}"></label><label class="f">Min events to rank in the year<input id="c_minEventsAnnual" type="number" value="${c.minEventsAnnual}"></label></div></div>`;
  h+=`<div class="card"><h3>Year &amp; seasons</h3><div class="grid2"><label class="f">Organisation name (on cards)<input id="c_org" value="${esc(c.org)}"></label><label class="f">Short name (header)<input id="c_short" value="${esc(c.short)}"></label></div><div class="grid3"><label class="f">Championship year<input id="c_year" type="number" value="${c.year}"></label><label class="f">Year starts<input id="c_ys" type="date" value="${c.yearStart}"></label><label class="f">Year ends<input id="c_ye" type="date" value="${c.yearEnd}"></label><label class="f">Season 1 starts<input id="c_s1s" type="date" value="${c.seasons[1].start}"></label><label class="f">Season 1 ends<input id="c_s1e" type="date" value="${c.seasons[1].end}"></label><span></span><label class="f">Season 2 starts<input id="c_s2s" type="date" value="${c.seasons[2].start}"></label><label class="f">Season 2 ends<input id="c_s2e" type="date" value="${c.seasons[2].end}"></label></div></div><button class="btn gold" data-act="scsave">Save scoring &amp; settings</button>`;
  return h}
async function saveScoring(){
  const c=CFG(),n=i=>+$('#'+i).value,s={};SCF.forEach(([k])=>s[k]=n('sc_'+k));
  if(s.perfMin>s.perfMax){toast('Performance minimum must not exceed the maximum.');return}
  if(s.streakEvery<1){toast('Streak length must be at least 1.');return}
  await put('config','main',{...c,org:$('#c_org').value.trim()||c.org,short:$('#c_short').value.trim()||c.short,year:n('c_year'),yearStart:$('#c_ys').value,yearEnd:$('#c_ye').value,scoring:s,sp:{regular:n('sp_regular'),challenge:n('sp_challenge'),gold:n('sp_gold')},goldCount:n('c_goldCount'),minEventsSeason:n('c_minEventsSeason'),minEventsAnnual:n('c_minEventsAnnual'),seasons:{1:{start:$('#c_s1s').value,end:$('#c_s1e').value},2:{start:$('#c_s2s').value,end:$('#c_s2e').value}}});
  toast('Saved');_cache=null;render()}

/* prizes */
UI.pz={};
function aPrizes(A){const p=S.prizes.main||{status:'soon',teaser:'Something BIG awaits the Top 5 👀',items:{}};
  const R=[1,2,3,4,5].map(r=>({r,...(p.items&&p.items[r]||{})}));
  const st=[['hidden','Hidden'],['soon','Coming soon'],['teaser','Teaser'],['live','Announced']];
  let h=`<div class="card"><h3>Grand Prize visibility</h3><div class="row" style="margin-bottom:12px">${st.map(s=>`<label class="chip ${p.status===s[0]?'navy':''}" style="padding:7px 14px;cursor:pointer"><input type="radio" name="pz_status" value="${s[0]}" ${p.status===s[0]?'checked':''} style="margin-right:6px">${s[1]}</label>`).join('')}</div><label class="f">Teaser text<input id="pz_teaser" value="${esc(p.teaser||'')}" placeholder="TOP 5 GRAND PRIZE — COMING SOON  or  Something BIG awaits the Top 5 👀"></label><div class="grid2"><label class="f">Prize headline (when announced)<input id="pz_headline" value="${esc(p.headline||'Year-End Grand Prize')}"></label><label class="f">Overall eligibility<input id="pz_elig" value="${esc(p.eligibility||'')}" placeholder="Top 5 eligible members only"></label></div></div>`;
  h+=R.map(x=>{const img=UI.pz[x.r]!==undefined?UI.pz[x.r]:x.image;return`<div class="card"><h3>Rank #${x.r}${x.r===1?' · Champion':''}</h3><div class="grid2"><label class="f">Prize title<input id="pz${x.r}_title" value="${esc(x.title)}"></label><label class="f">Sponsor<input id="pz${x.r}_sponsor" value="${esc(x.sponsor)}"></label></div><div class="grid2"><label class="f">Prize value<input id="pz${x.r}_value" value="${esc(x.value)}" placeholder="₹25,000"></label><label class="f">Eligibility<input id="pz${x.r}_elig" value="${esc(x.elig)}"></label></div><label class="f">Description<textarea id="pz${x.r}_desc">${esc(x.desc)}</textarea></label>${x.r===1?`<label class="f">Extra for the Champion (trophy, exclusive reward)<input id="pz1_extra" value="${esc(x.extra)}"></label>`:''}<div class="row"><img id="pzimg${x.r}" src="${img||''}" alt="" style="width:84px;height:84px;object-fit:cover;border-radius:10px;background:var(--surface2);${img?'':'visibility:hidden'}"><label class="btn ghost sm">Prize image<input type="file" accept="image/*" class="hide" data-chg="pzimg" data-r="${x.r}"></label><button class="btn ghost sm" data-act="pzclear" data-r="${x.r}">Remove image</button></div></div>`}).join('');
  return h+`<button class="btn gold" data-act="pzsave">Save prizes</button>`}
async function savePrizes(){
  const p=S.prizes.main||{items:{}},items={};
  for(let r=1;r<=5;r++){const g=k=>($('#pz'+r+'_'+k)||{value:''}).value.trim();items[r]={title:g('title'),sponsor:g('sponsor'),value:g('value'),elig:g('elig'),desc:g('desc'),image:UI.pz[r]!==undefined?UI.pz[r]:(p.items&&p.items[r]&&p.items[r].image)||''};if(r===1)items[r].extra=g('extra')}
  const sel=document.querySelector('input[name=pz_status]:checked');
  await put('prizes','main',{status:sel?sel.value:'soon',teaser:$('#pz_teaser').value.trim(),headline:$('#pz_headline').value.trim(),eligibility:$('#pz_elig').value.trim(),items});UI.pz={};toast('Prizes saved');_cache=null;render()}
function imgToData(file,max=420,q=.72){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=im.width*k|0;cv.height=im.height*k|0;cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);res(cv.toDataURL('image/jpeg',q))};im.onerror=rej;im.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}

/* data explorer */
function aData(A){
  const cols=COLS.filter(c=>c!=='secrets'||ST.ME.isAdmin),col=UI.exCol,ids=Object.keys(S[col]||{}).sort(),id=UI.exId;
  const raw=id&&S[col][id]!==undefined?JSON.stringify(S[col][id],null,2):'',locked=raw.includes('data:image');
  const shown=locked?raw.replace(/"data:image[^"]{0,40}[^"]*"/g,'"[image data]"'):raw;
  return`<div class="note">Everything the app stores lives here as JSON documents at <span class="path">collection/document</span> paths. ${ST.mode==='cloud'?'Edits are live for every member.':'Preview mode: stored in this browser.'} Be careful: there is no undo.</div>
  <div class="explorer"><div class="list" role="listbox" aria-label="Collections">${cols.map(c=>`<button data-act="excol" data-v="${c}" aria-current="${c===col}"><span>${c}</span><span class="muted">${Object.keys(S[c]).length}</span></button>`).join('')}</div>
  <div><div class="list" aria-label="Documents">${ids.length?ids.map(i=>`<button data-act="exid" data-v="${esc(i)}" aria-current="${i===id}"><span style="overflow:hidden;text-overflow:ellipsis">${esc(i)}</span></button>`).join(''):'<div class="muted" style="padding:12px">Empty collection</div>'}</div><div class="row" style="margin-top:8px"><input id="exnew" placeholder="new-doc-id" style="flex:1;min-width:0;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg)"><button class="btn ghost sm" data-act="exnew">Add</button></div></div>
  <div>${id?`<div class="spread" style="margin-bottom:8px"><span class="path">${esc(col)}/${esc(id)}</span><div class="row"><button class="btn gold sm" data-act="exsave" ${locked?'disabled':''}>Save</button><button class="btn danger sm" data-act="exdel">Delete</button></div></div>${locked?'<p class="note">This document holds images. Edit images from the Events or Grand Prize tab.</p>':''}<textarea id="exjson" class="json" spellcheck="false" ${locked?'readonly':''}>${esc(shown)}</textarea>`:'<div class="empty"><b>Pick a document</b>Choose a collection and document to inspect or edit.</div>'}<div class="row" style="margin-top:12px"><button class="btn ghost sm" data-act="exexport">Export everything (JSON)</button></div></div></div>`}

/* ============ events / actions ============ */
document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act;e.preventDefault();
  try{await act(a,t)}catch(err){console.error(err);toast('That didn\'t work: '+(err&&(err.message||err.code)||'unknown error'))}});
document.addEventListener('change',async e=>{
  const t=e.target.closest('[data-chg]');if(!t)return;const k=t.dataset.chg;
  try{
    if(k==='viewas'){UI.viewAs=t.value||null;render()}
    else if(k==='qrfile'&&t.files[0]){const raw=await decodeFile(t.files[0]);if(!raw){$('#scres').innerHTML='<div class="res-bad">Couldn\'t read a QR code in that photo. Try a sharper, closer shot.</div>';return}handleScan(raw)}
    else if(k==='evimg'&&t.files[0]){const d=await imgToData(t.files[0],1000,.72);UI.evImg=d;const im=$('#evimg');im.src=d;im.style.visibility='visible';toast('Image added. Tap Save changes to keep it.')}
    else if(k==='pzimg'&&t.files[0]){const d=await imgToData(t.files[0]),r=t.dataset.r;UI.pz[r]=d;const im=$('#pzimg'+r);im.src=d;im.style.visibility='visible'}
  }catch(err){toast('Couldn\'t process that file.')}});
async function act(a,t){
  const v=t.dataset.v,id=t.dataset.id;
  switch(a){
    case'close':closeModal();break;
    case'signin':{const name=$('#si_name').value.trim().replace(/\s+/g,' '),pin=$('#si_pin').value.trim(),rem=$('#si_rem').checked;
      if(!name){toast('Enter your name.');return}
      if(!/^\d{4,8}$/.test(pin)){toast('PIN must be 4 to 8 digits.');return}
      const uid='u_'+(await sha('jito:'+name.toLowerCase())).slice(0,12),ph=await sha(uid+':'+pin),m=S.members[uid];
      if(m&&m.pin&&m.pin!==ph){toast('That PIN doesn\'t match this name.');return}
      if(!m)await put('members',uid,{name,joinedAt:Date.now(),pin:ph});else if(!m.pin)await put('members',uid,{...m,pin:ph});
      ST.ME.uid=uid;ST.ME.name=(S.members[uid]||{name}).name;ST.onboarded=true;saveSession({uid},rem);closeModal(true);toast('Signed in as '+ST.ME.name);render();window.scrollTo(0,0);break}
    case'signout':{if(!await ask('Sign out on this device? You can sign back in with your name and PIN.','Sign out'))break;
      store.del(SKEY);store.del('jito_admin');UI.admin=false;UI.viewAs=null;UI.tab='home';ST.ME={uid:'guest',name:'',isAdmin:false};ST.skipName=true;render();showSignIn();break}
    case'slide':{slideHold=Date.now()+8000;scrollSlide(+v);break}
    case'ask-yes':window.__ask&&window.__ask(true);break;
    case'ask-no':window.__ask&&window.__ask(false);break;
    case'tab':UI.tab=v;render();window.scrollTo(0,0);break;
    case'mode':if(v==='a'&&!ST.ME.isAdmin){openModal(`<button class="btn ghost sm x" data-act="close">Close</button><h2>Admin access</h2><p class="muted" style="margin-bottom:12px">Enter the admin password to manage events, scoring and prizes.</p><label class="f">Password<input id="adpw" type="password" autocomplete="current-password"></label><label class="chk"><input type="checkbox" id="adrem" checked> Keep me signed in as admin on this device</label><div id="adErr"></div><button class="btn gold" data-act="adminlogin" data-submit>Join as admin</button>`);setTimeout(()=>{const i=$('#adpw');i&&i.focus()},60);break}UI.admin=v==='a';render();window.scrollTo(0,0);break;
    case'adminlogin':{const ok=(await sha($('#adpw').value))===ADMIN_HASH;if(!ok){$('#adErr').innerHTML='<div class="res-bad">Wrong password. Try again.</div>';return}store.set('jito_admin',ADMIN_HASH,$('#adrem')?$('#adrem').checked:true);ST.ME.isAdmin=true;UI.admin=true;closeModal(true);toast('Admin access granted');render();window.scrollTo(0,0);break}
    case'adminlock':store.del('jito_admin');ST.ME.isAdmin=false;UI.admin=false;toast('Admin locked');render();break;
    case'atab':UI.atab=v;render();break;
    case'season':UI.season=+v;render();break;
    case'scan':openScanner(id);break;
    case'manual':$('#manual').classList.remove('hide');$('#mcode').focus();break;
    case'mgo':{const val=$('#mcode').value.trim();if(!val)return;handleScan(val);break}
    case'savename':{const n=$('#nm').value.trim();if(!n){toast('Enter a name to continue.');return}await put('members',ST.ME.uid,{name:n,joinedAt:Date.now()});ST.ME.name=n;ST.onboarded=true;closeModal(true);render();break}
    case'editname':openModal(`<h2>Display name</h2><label class="f">Name<input id="nm" maxlength="40" value="${esc(nameOf(ST.ME.uid))}"></label><button class="btn gold" data-act="savename">Save</button>`);break;
    case'card':openCard(+t.dataset.year,t.dataset.u);break;
    case'savecard':{const d=window.__card;await saveCanvas($('#cardcv'),`jito-${d.year}-${d.name.replace(/\W+/g,'-').toLowerCase()}.png`);break}
    case'viewasm':UI.viewAs=t.dataset.u;UI.admin=false;UI.tab='home';render();break;
    // admin: seasons / year
    case'finalize':if(await ask(`Finalize Season ${t.dataset.n}? The ranking freezes, Gold members are marked and CP is awarded.`,'Finalize')){await finalizeSeason(+t.dataset.n);toast('Season finalized');render()}break;
    case'undoseason':if(await ask(`Undo Season ${t.dataset.n} finalization? Its Gold list and awarded CP are removed.`,'Undo')){await undoSeason(+t.dataset.n);toast('Finalization removed');render()}break;
    case'closeyear':if(await ask('Close the year? The leaderboard freezes, the Top 5 are written to the Hall of Fame and badges are issued.','Close year')){await closeYear();toast('Year closed. Top 5 crowned.');render()}break;
    case'nextyear':if(await ask('Start the next championship year? Dates shift forward one year and the leaderboard starts from zero. Past results stay in the Hall of Fame.','Start new year')){await startNextYear();toast('New year started');render()}break;
    case'demo':if(await ask('Load demo data? It adds sample members, events and results alongside what\'s already here.','Load demo')){await loadDemo();render()}break;
    case'wipe':if(await ask('Erase every event, member, award and result? This cannot be undone.','Erase everything')){await wipeAll();UI.viewAs=null;toast('All data erased');render()}break;
    // events
    case'evsave':await saveEvent();break;
    case'evnew':UI.evEdit=null;UI.evImg=undefined;render();break;
    case'evimgclear':UI.evImg='';{const im=$('#evimg');if(im){im.removeAttribute('src');im.style.visibility='hidden'}}break;
    case'evedit':UI.evEdit=id;UI.evImg=undefined;render();window.scrollTo(0,0);break;
    case'evdel':if(await ask(`Delete "${(S.events[id]||{}).title}"? Check-ins for it stop counting.`,'Delete')){await del('events',id);await del('secrets',id);toast('Event deleted');render()}break;
    case'evqr':showEventQR(id);break;
    case'evregen':if(await ask('Generate a new code? Printed QR codes for this event stop working.','Regenerate')){const tok=genToken(),e=S.events[id];await put('secrets',id,{token:tok});await put('events',id,{...e,tokenHash:await sha(tok)});S.secrets[id]={token:tok};showEventQR(id)}break;
    case'posterSave':await saveCanvas($('#posterc'),`qr-${(S.events[id]||{}).title||id}.png`.replace(/\s+/g,'-'));break;
    case'evatt':attendeesModal(id);break;
    case'uncheck':{const u=t.dataset.u,cur={...((S.checkins[u]||{}).events||{})};delete cur[id];await put('checkins',u,{events:cur});S.checkins[u]={events:cur};_cache=null;attendeesModal(id);render();break}
    // awards
    case'awadd':await addAward();break;
    case'awdel':{const c=CFG();await put('awards','y'+c.year,{items:awardsOf(c.year).filter(x=>x.id!==id)});_cache=null;render();break}
    case'scsave':await saveScoring();break;
    case'pzsave':await savePrizes();break;
    case'pzclear':UI.pz[t.dataset.r]='';{const im=$('#pzimg'+t.dataset.r);im.removeAttribute('src');im.style.visibility='hidden'}break;
    // explorer
    case'excol':UI.exCol=v;UI.exId=null;render();break;
    case'exid':UI.exId=v;render();break;
    case'exnew':{const n=$('#exnew').value.trim();if(!/^[\w\-.~:@+]+$/.test(n)){toast('Use letters, digits and - _ . ~ : @ + only.');return}await put(UI.exCol,n,{});UI.exId=n;render();break}
    case'exsave':{let o;try{o=JSON.parse($('#exjson').value);if(!o||typeof o!=='object'||Array.isArray(o))throw 0}catch(x){toast('That isn\'t a valid JSON object.');return}await put(UI.exCol,UI.exId,o);toast('Saved');_cache=null;render();break}
    case'exdel':if(await ask(`Delete ${UI.exCol}/${UI.exId}?`,'Delete')){await del(UI.exCol,UI.exId);UI.exId=null;render()}break;
    case'exexport':{const dl=ST.dl;if(!dl){toast('Downloads aren\'t available here.');return}try{await dl.save({filename:'road-to-champion-backup.json',data:JSON.stringify(S,null,2)})}catch(x){if(x.code!=='declined')toast('Couldn\'t save the backup.')}break}
  }}

/* ============ boot ============ */
ST.got={};
(async function boot(){
  const T=(p,ms)=>Promise.race([Promise.resolve(p),new Promise(r=>setTimeout(()=>r(null),ms))]);
  let db=null,user=null,me=null,needSignIn=false;
  try{if(window.claude&&claude.use){[db,user]=await Promise.all([T(claude.use('db'),3500).catch(()=>null),T(claude.use('user'),3500).catch(()=>null)])}}catch(e){}
  if(user){try{me=await T(user.me(),3000)}catch(e){}}
  try{ST.dl=window.claude&&claude.use?await T(claude.use('downloads'),2000):null}catch(e){ST.dl=null}
  const sess=getSession();
  if(db&&me&&me.id){ST.mode='cloud';ST.db=db;ST.ME={uid:me.id,name:me.name||'',isAdmin:wasUnlocked()};watchAll()}
  else{ST.mode='local';lsLoad();
    if(sess&&sess.uid&&S.members[sess.uid]){ST.ME={uid:sess.uid,name:S.members[sess.uid].name,isAdmin:wasUnlocked()};ST.onboarded=true}
    else{ST.ME={uid:'guest',name:'',isAdmin:wasUnlocked()};ST.skipName=true;needSignIn=true}}
  ST.ready=true;render();if(needSignIn)showSignIn()})();
</script></body></html>
